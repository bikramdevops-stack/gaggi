trigger:
 - main
 - feature/*

pool: mypool

parameters:
- name: environments
  displayName: which environment?
  type: string
  values:
  - prod 
  - dev


stages:
  - stage: Validate
    displayName: Validate
    jobs:  
      - job: 
        displayName: Validate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            displayName: init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: '${{ parameters.environment }}.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'

  - stage: Plan
    displayName: Plan
    jobs:  
      - job: 
        displayName: plan
        steps:
          - task: TerraformTask@5
            displayName: init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'aaa.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
              environmentServiceNameAzureRM: 'newservice'


          
